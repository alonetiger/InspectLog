[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "inspectlog"
version = "1.0.0"
description = "Inspect Log - Hardware Genuineness and Health Verification Suite for Windows"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "PySide6>=6.6",
    "psutil>=5.9",
    "WMI>=1.5",
    "pywin32>=306",
    "py-cpuinfo>=9.0",
    "pynvml>=11.5",
    "reportlab>=4.0",
    "numpy>=1.26",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "PyInstaller>=6.0",
]
audio = [
    "sounddevice>=0.4",
]

[project.scripts]
inspectlog = "inspectlog.__main__:main"
InspectLog = "inspectlog.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
